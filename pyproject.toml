[project]
name = "ez-spell-tracker"
version = "1.1.0"
description = "Enemy summoner-spell cooldown tracker for League of Legends"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["PySide6==6.11.1", "requests==2.34.2"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-qt==4.5.0", "pyinstaller==6.20.0", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["lib", "build", "dist", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W", "SIM"]
